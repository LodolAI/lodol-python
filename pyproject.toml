[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lodol"
dynamic = ["version"]
description = "Python SDK for the Lodol Developer API"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Lodol"}
]
license = {text = "Apache-2.0"}
dependencies = [
    "requests>=2.25.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# Test runner + coverage. Kept version-lenient so it installs across the full
# supported Python matrix (3.9–3.13) exercised in CI.
test = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
]
# Formatter / linter / type checker. Pinned to match the versions used by the
# main lodol repository's CI so results are reproducible. The lint job runs on
# Python 3.13 only, so these need not span the full test matrix.
lint = [
    "black==26.5.1",
    "mypy==2.3.0",
    "pylint==4.0.6",
]
# Everything needed for local development (`pip install -e .[dev]`).
dev = [
    "lodol[test,lint]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "lodol.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
lodol = ["py.typed"]
