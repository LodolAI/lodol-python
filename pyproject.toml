[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lodol"
dynamic = ["version"]
description = "Run your Lodol workflows from Python: start runs, wait for them, and answer approvals"
readme = "README.md"
# Every Python that isn't past end of life, plus 3.10 (end of life October
# 2026) for a grace period, as the httpx2 and anyio it builds on support.
requires-python = ">=3.10"
authors = [
    {name = "Lodol"}
]
license = "Apache-2.0"
dependencies = [
    "httpx2>=2.14.0,<3",
    "anyio>=4.15.1,<5",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: AsyncIO",
    "Framework :: Trio",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://lodol.com"
Documentation = "https://docs.lodol.com"
Source = "https://github.com/LodolAI/lodol-python"
Issues = "https://github.com/LodolAI/lodol-python/issues"
Changelog = "https://github.com/LodolAI/lodol-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Test runner + coverage. Kept version-lenient so it installs across the full
# supported Python matrix (3.10–3.15) exercised in CI. Async tests run on
# anyio's own pytest plugin, which comes with anyio, under asyncio and trio.
test = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "trio>=0.34.0",
]
# Formatter / linter / type checker. Pinned to match the versions used by the
# main lodol repository's CI so results are reproducible. The lint job runs on
# Python 3.13 only, so these need not span the full test matrix.
lint = [
    "black==26.10.1",
    "mypy==2.4.0",
    "pylint==4.1.3",
]
# Everything needed for local development (`pip install -e .[dev]`).
dev = [
    "lodol[test,lint]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "lodol.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
lodol = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
# Format for the oldest Python the package supports.
target-version = ["py310"]
